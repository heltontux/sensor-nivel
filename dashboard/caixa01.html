<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Caixa d'Água</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 20px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
    }

    .tank {
      width: 120px;
      height: 250px;
      border: 4px solid #94a3b8;
      border-radius: 10px;
      margin: auto;
      position: relative;
      overflow: hidden;
    }

    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 0%;
      transition: height 0.5s ease;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .metric {
      background: #334155;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    canvas {
      background: #1e293b;
      border-radius: 12px;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>💧 Dashboard Caixa d'Água</h2>

  <div class="grid">

    <!-- Caixa -->
    <div class="card">
      <div class="tank">
        <div id="water" class="water"></div>
      </div>
      <h2 id="percent">0%</h2>
      <p id="volume">0 L</p>
    </div>

    <!-- Métricas -->
    <div class="card metrics">
      <div class="metric"><div>Status</div><strong id="status">-</strong></div>
      <div class="metric"><div>Volume</div><strong id="vol">-</strong></div>
      <div class="metric"><div>Capacidade</div><strong>1000 L</strong></div>
      <div class="metric"><div>Atualização</div><strong>Tempo real</strong></div>
    </div>

  </div>

  <br>

  <!-- Gráfico -->
  <canvas id="chart" height="100"></canvas>
</div>

<script>
  let distancia = null;
  let distanciaAnterior = null;
  let tolerancia = 0.3; // cm

  const water = document.getElementById('water');
  const percentEl = document.getElementById('percent');
  const volumeEl = document.getElementById('volume');
  const statusEl = document.getElementById('status');
  const volEl = document.getElementById('vol');

  const ctx = document.getElementById('chart').getContext('2d');

  const chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        label: 'Volume (L)',
        data: [],
        borderWidth: 2
      }]
    },
    options: {
      scales: {
        y: { beginAtZero: true }
      }
    }
  });

  function getColor(nivel) {
    if (nivel > 60) return '#22c55e';
    if (nivel > 30) return '#facc15';
    return '#ef4444';
  }

  function status() {
    let status = "parado";
      if (distancia < distanciaAnterior - tolerancia) {
        status = "enchendo";
      } else if (distancia > distanciaAnterior + tolerancia) {
        status = "esvaziando";
      } else {
        status = "estavel";
      }
   return status;
  }

  async function atualizar() {
    try {
      const res = await fetch('https://api-sensor-33x4.onrender.com/dados');
      const data = await res.json();
      distancia = data.distance;
      distanciaAnterior = data.distanciaAnterior;
      const alturaMax = 80; // cm
      const alturaMin = 26.5; // cm
      const nivel = ((alturaMax - distancia) / (alturaMax - alturaMin)) * 100;
      const nivelClamp = Math.max(0, Math.min(100, nivel));
      const volume = Math.round((nivelClamp / 100) * 1000);

      // UI
      water.style.height = nivelClamp + '%';
      water.style.background = getColor(nivelClamp);

      percentEl.innerText = nivelClamp.toFixed(0) + '%';
      volumeEl.innerText = volume + ' L';

        statusEl.innerText = status();
        statusEl.style.color = status() === "enchendo" ? 'green' : (status() === "esvaziando" ? 'red' : 'gray'); 
        volEl.innerText = volume + ' L';

      // gráfico
      const time = new Date().toLocaleTimeString();

      chart.data.labels.push(time);
      chart.data.datasets[0].data.push(volume);

      if (chart.data.labels.length > 20) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }

      chart.update();

    } catch (e) {
      console.error(e);
    }
  }
  setInterval(atualizar, 3000);
</script>

</body>
</html>
